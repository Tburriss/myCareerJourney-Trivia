<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restore Classic Quiz Progress</title><style>body{font:17px Segoe UI,Arial,sans-serif;background:#f4f1ff;color:#21123d;padding:28px}main{max-width:680px;margin:auto;background:white;padding:28px;border-radius:20px}button,input{font:inherit;margin:12px 0}button{background:#6438f5;color:white;border:0;border-radius:12px;padding:14px}p{line-height:1.5}</style><main><h1>Restore Classic Quiz Progress</h1><p>Select the latest myCareerJourney game. This removes only the branching trail and restores the original row of numbered dots. Badges, personalized messages, recap, artwork, and saved results are preserved. Files stay on your device.</p><label for="game">Game HTML file</label><br><input id="game" type="file" accept=".html,.htm"><br><button id="build">Create Updated Game</button><p id="status" role="status"></p></main><script>
const css=`.milestones{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:6px;margin:0 0 20px;padding:5px 2px;list-style:none;background:none;border-radius:0}.milestone{aspect-ratio:1;min-height:0;border-radius:50%;font-size:12px;box-shadow:none;transform:none!important;grid-row:auto!important;grid-column:auto!important}.milestone.done{box-shadow:none}.milestone.current{outline:none}.milestone::before,.milestone::after{display:none!important}.trail-note{display:none}@media(max-width:620px){.milestones{gap:3px}.milestone{font-size:9px}}`;
document.getElementById('build').onclick=async()=>{const status=document.getElementById('status'),file=document.getElementById('game').files[0];if(!file){status.textContent='Select your game HTML first.';return}try{let text=await file.text();if(!text.includes('id="milestones"')||!text.includes('function updateMilestones('))throw Error('This file does not match the current game. Nothing was changed.');text=text.replace(/dot\.textContent=i===questions\.length-1\?'🏆':String\(i\+1\);const row=Math\.floor\(i\/5\),col=i%5;dot\.style\.gridRow=String\(row\+1\);dot\.style\.gridColumn=String\(row%2\?5-col:col\+1\);/,'dot.textContent=String(i+1);');text=text.replace(/<p class="trail-note">[\s\S]*?<\/p>/,'').replace('aria-label="Quiz milestone trail, not official career progress"','aria-label="Quiz progress"');text=text.replace('</head>','<style>'+css+'</style></head>');const url=URL.createObjectURL(new Blob([text],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='myCareerJourney-classic-progress.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);status.textContent='Updated game download requested. Rename it index.html for GitHub.'}catch(e){status.textContent=e.message}};
</script></html>
